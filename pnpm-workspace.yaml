allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Security/dedupe pins. These lived in package.json "overrides", which pnpm
# silently IGNORES (npm-only field) — they must live here to keep applying.
overrides:
  # Security floors (2026-10-30 dev-toolchain sweep): stay inside the
  # major the parents already allow; pnpm does not re-resolve these on update.
  'vite@8': '^8.2.4'
  glob: ^10.5.0
  fast-xml-parser: ^5.7.0
  protobufjs: ^7.6.5
  ws: ^8.21.1
  handlebars: ^4.7.9
  flatted: ^3.4.2
  # npm's override said `$postcss` (follow the direct dep); pnpm 11 deprecates
  # that reference syntax, so the range is spelled out — keep in sync with the
  # postcss entry in package.json dependencies.
  postcss: ^8.5.10
  '@babel/core': ^7.29.6
  yaml: ^2.8.3
  sharp: ^0.35.4
  picomatch@2: 2.3.2
  picomatch@4: 4.0.5
  minimatch@3: 3.1.5
  minimatch@9: 9.0.9
  js-yaml@3: 3.15.0
  js-yaml@4: 4.3.0

# Our own packages are published by our own tagged workflows; minimumReleaseAge
# would refuse each fresh publish until it ages. One scope glob covers every
# @bitbaum package; the four unscoped ones are named (fleet SHARED.md).
minimumReleaseAgeExclude:
  - '@bitbaum/*'
  - limitkit
  - bip-kit
  - threadkit
  - ai-forms
