name: CI

# The verification that used to live inside the Vercel deploy workflow. It
# belongs in its own file: prod is self-hosted on bitbaum, so the deploy
# workflow is now a shim over the shared pipeline — and that pipeline refuses
# to ship a commit whose CI is not green. Without this file there would be no
# CI to be green, and every deploy would sail through unverified.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # SSOT: "verified" is defined ONCE, in package.json `verify`
      # (= format:check + lint + test + build), and run identically here and
      # locally. This used to hand-copy those four steps, which drifts the
      # moment `verify` changes — and each carried `--if-present`, so renaming
      # or deleting a script would have turned its gate into a silent pass. A
      # gate that cannot go red is worse than no gate, because it is believed.
      - name: Verify
        run: npm run verify
